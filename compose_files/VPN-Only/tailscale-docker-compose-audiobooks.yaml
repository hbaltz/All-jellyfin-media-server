services:

  # ── TAILSCALE ─────────────────────────────────────────────
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: homeserver
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
      - 5055:5055
      # ↓ ADDED — audiobook front-ends sharing this netns
      - 13378:13378   # audiobookshelf
      - 5056:5056     # shelfarr (requests — the Jellyseerr of books, next to jellyseerr's 5055)
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ${COMMON_PATH}/configs/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped

  # ── JELLYFIN ──────────────────────────────────────────────
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/jellyfin:/config
      - ${COMMON_PATH}/jellyfin/cache:/cache
      - ${COMMON_PATH}/sonarr/tv:/data/tvshows
      - ${COMMON_PATH}/radarr/movies:/data/movies
      - ${COMMON_PATH}/qbittorrent/downloads:/data/media_downloads
      # ↓ ADDED — optional: browse audiobooks in Jellyfin too (needs the Bookshelf plugin)
      - ${COMMON_PATH}/chaptarr/audiobooks:/data/audiobooks
    restart: unless-stopped

  # ── JELLYSEERR ────────────────────────────────────────────
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: jellyseerr
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}/configs/jellyseerr:/app/config
    restart: unless-stopped

  # ── GLUETUN ───────────────────────────────────────────────
  gluetun:
    container_name: GlueTun-VPN
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    ports:
      - 8080:8080
      - 51820:51820
      - 51820:51820/udp
      - 46931:46931
      - 46931:46931/udp
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - VPN_ENDPOINT_IP=${ENDPOINT_IP}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDR}
      - VPN_ENDPOINT_PORT=${ENDPOINT_PORT}
      - VPN_DNS_ADDRESS=${DNS_ADDRESS}
      - WIREGUARD_PUBLIC_KEY=${PUBLIC_KEY}
      - WIREGUARD_PRIVATE_KEY=${PRIVATE_KEY}
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - VPN_PORT_FORWARDING_STATUS_FILE=/tmp/gluetun/forwarded_port
      - TZ=${TZ}
      - UPDATER_PERIOD=24h
      - VPN_COUNTRY=NL
    restart: always
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/gluetun:/tmp/gluetun

  # ── QBITTORRENT ───────────────────────────────────────────
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    network_mode: service:gluetun
    container_name: qbittorrent
    depends_on:
      - gluetun
    environment:
      - WEBUI_PORT=8080
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/qbittorrent:/config
      - ${COMMON_PATH}/qbittorrent/downloads:/downloads
    restart: unless-stopped

  # ── QBIT PORT SYNC ────────────────────────────────────────
  qbit-port-sync:
    image: curlimages/curl:latest
    container_name: qbit-port-sync
    network_mode: service:gluetun
    depends_on:
      - gluetun
      - qbittorrent
    volumes:
      - ${COMMON_PATH}/scripts/qbit-port-sync.sh:/qbit-port-sync.sh:ro
      - ${COMMON_PATH}/gluetun:/tmp/gluetun:ro
    command: sh /qbit-port-sync.sh
    restart: "no"

  # ── FLARESOLVERR ──────────────────────────────────────────
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}
      - LANG=fr_FR
    ports:
      - 8191:8191
    restart: unless-stopped

  # ── PROWLARR ──────────────────────────────────────────────
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}/configs/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  # ── SONARR ────────────────────────────────────────────────
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/sonarr:/config
      - ${COMMON_PATH}/sonarr/tv:/tv
      - ${COMMON_PATH}/qbittorrent/downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  # ── RADARR ────────────────────────────────────────────────
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}:${COMMON_PATH}
      - ${COMMON_PATH}/configs/radarr:/config
      - ${COMMON_PATH}/radarr/movies:/movies
      - ${COMMON_PATH}/qbittorrent/downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  # ── BAZARR ────────────────────────────────────────────────
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}/configs/bazarr:/config
      - ${COMMON_PATH}/radarr/movies:/movies
      - ${COMMON_PATH}/sonarr/tv:/tv
    ports:
      - 6767:6767
    restart: unless-stopped
    depends_on:
      - sonarr
      - radarr

  translatarr:
    image: aleknomu/translatarr:latest
    container_name: translatarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ${COMMON_PATH}/configs/translatarr:/config
      - ${COMMON_PATH}/radarr/movies:/movies
      - ${COMMON_PATH}/sonarr/tv:/tv
    ports:
      - 6868:6868

  # ══════════════════════════════════════════════════════════
  #  AUDIOBOOKS  (new)
  #  Layout mirrors the movies/tv stack:
  #    - audiobookshelf  = player/library      (like jellyfin)   -> tailnet
  #    - shelfarr         = requests + import  (like jellyseerr) -> tailnet
  #    - chaptarr        = acquisition manager  (like radarr)     -> LAN only
  #  Reuses the existing Prowlarr + qBittorrent.
  #  Create the dirs once:
  #    mkdir -p ${COMMON_PATH}/configs/{audiobookshelf,shelfarr,chaptarr} \
  #             ${COMMON_PATH}/chaptarr/{audiobooks,ebooks} \
  #             ${COMMON_PATH}/audiobookshelf/metadata
  # ══════════════════════════════════════════════════════════

  # ── AUDIOBOOKSHELF ────────────────────────────────────────
  # Web UI over Tailscale: http://homeserver:13378
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - TZ=${TZ}
      - PORT=13378
    volumes:
      - ${COMMON_PATH}/configs/audiobookshelf:/config
      - ${COMMON_PATH}/audiobookshelf/metadata:/metadata
      - ${COMMON_PATH}/chaptarr/audiobooks:/audiobooks
      - ${COMMON_PATH}/chaptarr/ebooks:/books
    restart: unless-stopped

  # ── SHELFARR ──────────────────────────────────────────────
  # "Jellyseerr for books": browse -> request -> search Prowlarr -> download
  # via qBittorrent -> rename/organise -> deliver into the Audiobookshelf
  # library. Unlike AudioBookRequest it owns the import step, so files land in
  # /audiobooks organised, not in a download folder waiting to be moved.
  # Web UI over Tailscale: http://homeserver:5056
  shelfarr:
    image: ghcr.io/pedro-revez-silva/shelfarr:${SHELFARR_VERSION:-latest}
    container_name: shelfarr
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - SOLID_QUEUE_IN_PUMA=1
      - HTTP_PORT=5056          # must match the port opened on the tailscale service
      - PUID=0                  # matches the rest of this stack; media dirs are root-owned
      - PGID=0
      - CHOWN_ON_START=auto
      - TZ=${TZ}
      # A secret key is auto-generated on first run and saved to /rails/storage.
    volumes:
      - ${COMMON_PATH}/configs/shelfarr:/rails/storage
      - ${COMMON_PATH}/chaptarr/audiobooks:/audiobooks
      - ${COMMON_PATH}/chaptarr/ebooks:/ebooks
      - ${COMMON_PATH}/qbittorrent/downloads:/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5056/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ── OPTIONAL: SHELFARR LIBATION COMPANION ─────────────────
  # Audible backup (beta). Idle until you connect an Audible account in
  # Shelfarr's admin UI. Internal only - no host port, no Docker socket.
  # If you enable it, also add to shelfarr:
  #   SHELFARR_LIBATION_URL=http://shelfarr-libation:8080
  #   SHELFARR_LIBATION_TOKEN_FILE=/run/shelfarr-libation/token
  #   SHELFARR_LIBATION_IMPORT_ROOT=/imports/libation
  #   volumes: libation_books:/imports/libation:ro and libation_control:/run/shelfarr-libation:ro
  # shelfarr-libation:
  #   image: ghcr.io/pedro-revez-silva/shelfarr-libation:${SHELFARR_VERSION:-latest}
  #   container_name: shelfarr-libation
  #   expose:
  #     - "8080"
  #   volumes:
  #     - libation_config:/config
  #     - libation_books:/data
  #     - libation_control:/control
  #   environment:
  #     - PUID=0
  #     - PGID=0
  #     - TZ=${TZ}
  #     - LIBATION_FILES_DIR=/config
  #     - LIBATION_BOOKS_DIR=/data
  #     - COMPANION_TOKEN_FILE=/control/token
  #     - ASPNETCORE_URLS=http://0.0.0.0:8080
  #   restart: unless-stopped

  # ── CHAPTARR ──────────────────────────────────────────────
  # Readarr fork (ebooks + audiobooks in one instance). Still BETA.
  # Image: Docker Hub 'chaptarr/chaptarr'. Consider pinning an explicit tag
  # (e.g. chaptarr/chaptarr:0.9.333) instead of 'latest' once you pick a version.
  # Web UI on the LAN: http://<host>:8789
  chaptarr:
    image: chaptarr/chaptarr:latest
    container_name: chaptarr
    environment:
      - PUID=0
      - PGID=0
      - TZ=${TZ}
    volumes:
      - ${COMMON_PATH}/configs/chaptarr:/config
      - ${COMMON_PATH}/chaptarr/audiobooks:/audiobooks
      - ${COMMON_PATH}/chaptarr/ebooks:/ebooks
      - ${COMMON_PATH}/qbittorrent/downloads:/downloads
    ports:
      - 8789:8789
    restart: unless-stopped

  # ── ALTERNATIVE: LAZYLIBRARIAN (instead of chaptarr) ──────
  # Older, more fiddly, but a stable image exists on LinuxServer.
  # lazylibrarian:
  #   image: lscr.io/linuxserver/lazylibrarian:latest
  #   container_name: lazylibrarian
  #   environment:
  #     - PUID=0
  #     - PGID=0
  #     - TZ=${TZ}
